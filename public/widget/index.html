<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bella Moda · Asistente</title>
<style>
  :root { --verde:#2E7D32; --azul:#1F5C8B; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:#f4f6f8; display:flex; justify-content:center; }
  #chat { width:100%; max-width:480px; height:100vh; background:#fff; display:flex; flex-direction:column; }
  header { background:var(--verde); color:#fff; padding:14px; font-weight:bold; }
  #msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:80%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; font-size:15px; }
  .bot { background:#e8f5e9; align-self:flex-start; }
  .yo { background:#e3f0fa; align-self:flex-end; }
  #rapidas { padding:0 12px 8px; display:flex; gap:6px; flex-wrap:wrap; }
  #rapidas button { border:1px solid var(--azul); background:#fff; color:var(--azul); border-radius:16px; padding:6px 12px; cursor:pointer; }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid #ddd; }
  input { flex:1; padding:12px; font-size:16px; border:1px solid #bbb; border-radius:8px; }
  form button { background:var(--azul); color:#fff; border:0; border-radius:8px; padding:0 18px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<div id="chat">
  <header>Bella Moda · Asistente</header>
  <div id="msgs"></div>
  <div id="rapidas">
    <button>Ver catálogo</button><button>Hacer un pedido</button>
    <button>Estado de mi pedido</button><button>Hablar con una persona</button>
  </div>
  <form id="f"><input id="t" placeholder="Escribe tu mensaje..." autocomplete="off"><button>Enviar</button></form>
</div>
<script>
let idConversacion = null;
const msgs = document.getElementById('msgs');

function pintar(texto, clase) {
  const d = document.createElement('div');
  d.className = 'm ' + clase; d.textContent = texto;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}

async function enviar(texto) {
  pintar(texto, 'yo');
  const espera = pintar('...', 'bot');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: texto, id_conversacion: idConversacion }),
    });
    const data = await r.json();
    if (data.id_conversacion) idConversacion = data.id_conversacion;
    espera.textContent = data.respuesta || data.error;
  } catch {
    espera.textContent = 'No hay conexión. Intenta de nuevo.';
  }
}

document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = document.getElementById('t');
  if (t.value.trim()) { enviar(t.value.trim()); t.value = ''; }
});
document.querySelectorAll('#rapidas button').forEach((b) =>
  b.addEventListener('click', () => enviar(b.textContent)));

pintar('¡Hola! Soy el asistente de Bella Moda. ¿En qué puedo ayudarte?', 'bot');
</script>
</body>
</html>
